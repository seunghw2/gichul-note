<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"><style>
:root{--g:#0D1513;--s:#16211E;--s2:#1E2B28;--line:#2A3935;--ink:#E7EEEB;--ink2:#AEBBB6;--ink3:#7C8B86;--brand:#7FC8B4}
*{box-sizing:border-box;margin:0;padding:0}body{background:#E4E7E2;font-family:"Pretendard Variable",sans-serif;padding:30px;width:880px;color:#16211F}
h1{font-size:21px}.sub{font-size:13px;color:#555;margin:4px 0 18px}
.row{display:flex;gap:26px}.cap{font-size:13px;font-weight:600;color:#444;text-align:center;margin-bottom:8px}
.ph{width:390px;background:var(--g);border-radius:28px;padding:22px 18px;color:var(--ink)}
.t{font-size:24px;font-weight:700;margin-bottom:14px}
.seg{display:flex;background:var(--s2);border-radius:14px;padding:4px;margin-bottom:12px}.seg div{flex:1;text-align:center;font-size:14px;font-weight:600;padding:10px 0;border-radius:11px;color:var(--ink3)}.seg .on{background:var(--s);color:var(--ink)}
.card{background:var(--s);border-radius:20px;padding:16px}.bar{height:6px;border-radius:9px;background:var(--s2)}.bar i{display:block;height:100%;width:14%;background:var(--brand);border-radius:9px}
.st{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px}.st b{font-size:22px;display:block}.st b small{font-size:14px;color:var(--ink3)}.st span{font-size:12.5px;color:var(--ink3)}.st .new b{color:var(--brand)}
.m{font-size:12px;color:var(--ink3);margin-top:3px}
</style></head><body><h1>"남은 오답" 자리 → 지금까지 푼 총 문제 수</h1><div class="sub">푼 문제 = 서로 다른 문항 · 총 풀이 = 다시 푼 것까지 모든 채점 횟수 (누적) · 숫자는 예시</div>
<div class="row">
<div><div class="cap">문제 풀기 탭</div><div class="ph"><div class="t">방카슈랑스 · 펀드</div><div class="seg"><div class="on">온라인 시험 기출</div><div>교재 문항</div></div>
<div class="card"><div class="bar"><i></i></div><div class="st"><div><b>22<small>/155</small></b><span>푼 문제</span></div><div class="new"><b>37</b><span>총 풀이</span></div><div><b>10</b><span>오늘 푼 문제</span></div></div></div></div></div>
<div><div class="cap">홈 과목 카드 (같이 바꿀 경우)</div><div class="ph"><div class="t">기출<span style="color:var(--brand)">노트</span></div>
<div class="card"><b style="font-size:18px">방카슈랑스 · 펀드</b><div class="m">농협은행 직무과정 집합평가 · 243문항</div><div class="bar" style="margin-top:12px"><i style="width:9%"></i></div><div class="st"><div><b>22<small>/243</small></b><span>푼 문제</span></div><div class="new"><b>37</b><span>총 풀이</span></div><div><b>10</b><span>오늘 푼 문제</span></div></div></div></div></div>
</div></body></html>
